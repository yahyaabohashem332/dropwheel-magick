name: Build Magick.Native for DropWheel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['build.ps1', '.github/workflows/build.yml']

permissions:
  contents: write

jobs:
  build:
    # As Magick.Native's own workflow: Visual Studio 2026.
    runs-on: windows-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
      - name: Build
        id: build
        shell: pwsh
        run: ./build.ps1 -Output out
      - uses: actions/upload-artifact@v7
        with:
          name: magick-native-win64
          path: |
            out/*.zip
            out/*-source.tar.gz
            out/SHA256SUMS.txt
          if-no-files-found: error
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # A release of its own for every build, never added to an older one: DropWheel pins each by its checksums.
        # (v1.0.0-dropwheel-magick holds the DLL DropWheel 1.23.1 shipped, built on a PC before this workflow ran.)
        run: |
          TAG="v15.0.0-dropwheel.${GITHUB_RUN_NUMBER}"
          cd out
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Magick.Native 15.0.0 Q8-x64 for DropWheel, build ${GITHUB_RUN_NUMBER} (no patented codecs)" --notes-file ../README.md *.zip *-source.tar.gz SHA256SUMS.txt
